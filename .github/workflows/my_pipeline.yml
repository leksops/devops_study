name: Python Code Quality Check

on:
  push:
    branches: [ main ]

jobs:
  lint-test-job:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Робот скачивает файлы вашего репозитория (app.py, system_check.py) к себе на сервер
      - name: Check out repository code
        uses: actions/checkout@v4

      # Шаг 2: Робот разворачивает чистую среду Python версии 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Шаг 3: Робот обновляет менеджер пакетов pip и устанавливает утилиту проверки flake8
      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # Шаг 4: Сам тест! Робот запускает проверку нашего файла автоматизации
      - name: Run Python Linter (flake8)
        run: flake8 system_check.py
