name: Python Quality & Docker Build

on:
  push:
    branches: [ main ]

jobs:
  lint-test-job:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Скачиваем код из репозитория
      - name: Check out repository code
        uses: actions/checkout@v4

      # Шаг 2: Ставим Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Шаг 3: Ставим линтер
      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # Шаг 4: Проверяем код на ошибки
      - name: Run Python Linter (flake8)
        run: flake8 system_check.py

      # Шаг 5: НОВЫЙ ШАГ! Если прошлый шаг прошёл успешно, робот запускает сборку Docker-образа
      - name: Build Docker Image in Cloud
        run: docker build -t my-system-bot:${{ github.sha }} .
